# sam deploy settings. Credentials come from the AWS profile below (or AWS_PROFILE).
version = 0.1

[default.global.parameters]
stack_name = "quench"
region = "ap-south-1"
profile = "quenchsip"

[default.deploy.parameters]
resolve_s3 = true
s3_prefix = "quench"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = "DomainName=quench.kavyan.dev CertificateArn=arn:aws:acm:us-east-1:040609978743:certificate/62af7903-6353-4b7f-ad85-d12b2d44f361"
