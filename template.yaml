AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Quench - water control room for plastic-free events

Parameters:
  AckTimeoutSeconds:
    Type: Number
    Default: 180
    Description: How long a runner has to tap "On my way" before the job goes to someone else
  DoneTimeoutSeconds:
    Type: Number
    Default: 2700
    Description: How long a runner has to tap "Delivered" before the job is closed as not confirmed
  AlertEmail:
    Type: String
    Default: ''
    Description: Optional. Email to notify when a tap lands in the dead-letter queue (confirm the email AWS sends)

  DemoEmail:
    Type: String
    Default: judge@quench.kavyan.dev
    Description: The shared judges' account (5 active events at most; its events are deleted after a day)
  DomainName:
    Type: String
    Default: ''
    Description: Optional. Your own address for the site, e.g. quench.example.dev (point a CNAME at the CloudFront domain)
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional. ACM certificate for DomainName; it must be in us-east-1 (CloudFront's rule)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasDomain: !And [!Not [!Equals [!Ref DomainName, '']], !Not [!Equals [!Ref CertificateArn, '']]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      # Old events clean themselves up: every item carries expiresAt (90 days after the event ends).
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization, x-organiser-pin, x-organiser-key, x-access-token]
      # Caps abuse and cost on the open routes (anyone can create an event). The peak we tested,
      # 500 taps in 30 s, is about 17 requests a second.
      DefaultRouteSettings:
        ThrottlingRateLimit: 50
        ThrottlingBurstLimit: 100

  # Organiser accounts. Anything stored (creating and running an event) needs one; planning doesn't.
  # Volunteers and runners never sign in: their QR links carry a per-station/per-runner secret.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: quench-organisers
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireNumbers: true
          RequireLowercase: false
          RequireUppercase: false
          RequireSymbols: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Quench code
        EmailMessage: 'Your Quench verification code is {####}'
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: quench-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false # a browser app can't keep a secret
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/handler.handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          DEMO_EMAIL: !Ref DemoEmail
          TABLE_NAME: !Ref Table
          STATE_MACHINE_ARN: !Ref DispatchStateMachine
          ACK_TIMEOUT_SECONDS: !Ref AckTimeoutSeconds
          DONE_TIMEOUT_SECONDS: !Ref DoneTimeoutSeconds
          TAP_QUEUE_URL: !Ref TapQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt DispatchStateMachine.Name
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess]
              Resource: '*' # task tokens are not tied to a resource ARN
        - SQSSendMessagePolicy:
            QueueName: !GetAtt TapQueue.QueueName
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # Every 2 minutes: when will each station run dry, has it gone quiet? Saved on the station.
  ProjectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/projector.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          STATE_MACHINE_ARN: !Ref DispatchStateMachine
          ACK_TIMEOUT_SECONDS: !Ref AckTimeoutSeconds
          DONE_TIMEOUT_SECONDS: !Ref DoneTimeoutSeconds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt DispatchStateMachine.Name
      Events:
        EveryTwoMinutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(2 minutes)

  # Taps go through a queue so a burst at the peak never waits on database writes.
  TapQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TapDeadLetterQueue.Arn
        maxReceiveCount: 3

  TapDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days, to inspect taps that could not be saved
  # Someone should know when a tap could not be saved: alarm as soon as the dead-letter queue has a message.
  TapDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A volunteer tap failed 3 times and is in the dead-letter queue. Check the tap consumer logs.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt TapDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlertEmail, [!Ref AlertTopic], !Ref AWS::NoValue]
  AlertTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlertEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  TapConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/tapConsumer.handler
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          STATE_MACHINE_ARN: !Ref DispatchStateMachine
          ACK_TIMEOUT_SECONDS: !Ref AckTimeoutSeconds
          DONE_TIMEOUT_SECONDS: !Ref DoneTimeoutSeconds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt DispatchStateMachine.Name
      Events:
        Taps:
          Type: SQS
          Properties:
            Queue: !GetAtt TapQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2 # leave Lambda capacity for the API (new accounts may only run 10 at once)

  # One function for every step of the dispatch state machine.
  DispatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api/dispatcher.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess]
              Resource: '*'

  # Runner dispatch, one execution per job:
  # assign a free runner (retry every 30 s) -> wait for "On my way" (reassign on timeout)
  # -> wait for "Delivered" (close as not confirmed on timeout).
  DispatchStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref DispatchFunction
      DefinitionSubstitutions:
        DispatchFunctionArn: !GetAtt DispatchFunction.Arn
      Definition:
        Comment: Quench runner dispatch
        StartAt: AssignRunner
        States:
          AssignRunner:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${DispatchFunctionArn}
              Payload:
                action: assign
                eventId.$: $.eventId
                jobId.$: $.jobId
            ResultSelector:
              assigned.$: $.Payload.assigned
              giveUp.$: $.Payload.giveUp
            ResultPath: $.assign
            Next: RunnerFound
          RunnerFound:
            Type: Choice
            Choices:
              - Variable: $.assign.assigned
                BooleanEquals: true
                Next: WaitForOnMyWay
              - Variable: $.assign.giveUp
                BooleanEquals: true
                Next: NoRunnerFree
            Default: WaitForFreeRunner
          WaitForFreeRunner:
            Type: Wait
            Seconds: 60
            Next: AssignRunner
          WaitForOnMyWay:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            TimeoutSecondsPath: $.ackTimeoutSeconds
            Parameters:
              FunctionName: ${DispatchFunctionArn}
              Payload:
                action: wait_ack
                eventId.$: $.eventId
                jobId.$: $.jobId
                token.$: $$.Task.Token
            ResultPath: $.ack
            Catch:
              - ErrorEquals: [States.Timeout]
                ResultPath: $.timeout
                Next: ReassignRunner
            Next: WaitForDelivered
          ReassignRunner:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${DispatchFunctionArn}
              Payload:
                action: ack_timeout
                eventId.$: $.eventId
                jobId.$: $.jobId
            ResultPath: null
            Next: AssignRunner
          WaitForDelivered:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            TimeoutSecondsPath: $.doneTimeoutSeconds
            Parameters:
              FunctionName: ${DispatchFunctionArn}
              Payload:
                action: wait_done
                eventId.$: $.eventId
                jobId.$: $.jobId
                token.$: $$.Task.Token
            ResultPath: $.done
            Catch:
              - ErrorEquals: [States.Timeout]
                ResultPath: $.timeout
                Next: NotConfirmed
            Next: Delivered
          NotConfirmed:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${DispatchFunctionArn}
              Payload:
                action: done_timeout
                eventId.$: $.eventId
                jobId.$: $.jobId
            ResultPath: null
            End: true
          NoRunnerFree:
            Type: Succeed
          Delivered:
            Type: Succeed

  # Website: private S3 bucket behind CloudFront. CloudFront also forwards /api/* to the HTTP API,
  # so the site and the API share one https address (no CORS, and the service worker can run).
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Quench website and API
        # Your own domain (optional): served next to the default *.cloudfront.net address.
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200 # includes India
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TapDeadLetterQueueUrl:
    Value: !Ref TapDeadLetterQueue
  DispatchStateMachineArn:
    Value: !Ref DispatchStateMachine
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
  WebUrl:
    Description: The site; the API is at /api on the same address
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${WebDistribution.DomainName}']
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
